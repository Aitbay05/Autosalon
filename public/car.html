<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoPrime — Автомобиль</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --black: #0d1117;
  --white: #fbfbf8;
  --sand: #f3efe5;
  --stone: #ddd8cd;
  --stone-dark: #736d62;
  --accent: #1565ff;
  --accent-dark: #0c47ba;
  --accent-soft: #e8f1ff;
  --green: #167c48;
  --gold: #9a6a12;
  --shadow: 0 30px 80px rgba(13, 17, 23, 0.12);
  --radius-xl: 28px;
  --radius-lg: 22px;
  --radius-md: 16px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'DM Sans', sans-serif;
  background:
    radial-gradient(circle at top right, rgba(21, 101, 255, 0.08), transparent 25%),
    linear-gradient(180deg, #fdfcf9 0%, #f7f5ef 100%);
  color: var(--black);
}
a { text-decoration: none; color: inherit; }
button, input, select { font: inherit; }

.container {
  width: min(calc(100% - 48px), 1180px);
  margin: 0 auto;
}

.site-header {
  position: sticky;
  top: 0;
  z-index: 120;
  backdrop-filter: blur(18px);
  background: rgba(251, 251, 248, 0.84);
  border-bottom: 1px solid rgba(115, 109, 98, 0.16);
}
.nav-shell {
  min-height: 74px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}
.logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 24px;
  letter-spacing: -1px;
}
.logo span { color: var(--accent); }
.nav-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.pill-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 18px;
  border-radius: 999px;
  border: 1px solid rgba(13, 17, 23, 0.14);
  background: rgba(255,255,255,0.76);
  color: var(--black);
  cursor: pointer;
  transition: background .2s ease, color .2s ease, transform .2s ease;
}
.pill-btn:hover {
  background: var(--black);
  color: white;
  transform: translateY(-1px);
}
.pill-btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.pill-btn.primary:hover { background: var(--accent-dark); }

.page-shell {
  padding: 28px 0 72px;
}
.loading-page {
  min-height: 55vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--stone-dark);
  font-size: 18px;
}

.car-detail {
  display: grid;
  gap: 24px;
}
.summary-banner {
  padding: 20px 24px;
  border-radius: 24px;
  background: rgba(255,255,255,0.82);
  border: 1px solid rgba(115, 109, 98, 0.12);
  box-shadow: var(--shadow);
}
.breadcrumb {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--stone-dark);
  margin-bottom: 14px;
}
.breadcrumb a { color: var(--accent); }
.summary-top {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 18px;
}
.car-brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
}
.car-brand::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}
.car-fullname {
  font-family: 'Syne', sans-serif;
  font-size: clamp(32px, 5vw, 48px);
  letter-spacing: -1.8px;
  line-height: 1;
  margin-bottom: 10px;
}
.car-price-big {
  font-family: 'Syne', sans-serif;
  font-size: clamp(28px, 4vw, 38px);
  color: var(--accent);
}
.summary-note {
  max-width: 440px;
  font-size: 14px;
  line-height: 1.7;
  color: var(--stone-dark);
}
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
}
.badge-new { background: rgba(22, 124, 72, 0.12); color: var(--green); }
.badge-used { background: rgba(154, 106, 18, 0.16); color: var(--gold); }

.detail-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.06fr) minmax(320px, 0.94fr);
  gap: 24px;
  align-items: start;
}
.panel {
  background: rgba(255,255,255,0.84);
  border-radius: var(--radius-xl);
  border: 1px solid rgba(115, 109, 98, 0.12);
  box-shadow: var(--shadow);
}
.gallery-panel {
  padding: 22px;
  position: sticky;
  top: 92px;
}
.main-img {
  position: relative;
  height: clamp(300px, 50vw, 500px);
  border-radius: 24px;
  overflow: hidden;
  background: linear-gradient(135deg, #eef3ff, #ebe6db);
  display: flex;
  align-items: center;
  justify-content: center;
}
.main-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  cursor: zoom-in;
}
.main-img svg { opacity: 0.2; }
.main-badge {
  position: absolute;
  top: 16px;
  left: 16px;
}
.thumb-row {
  margin-top: 14px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}
.thumb {
  height: 96px;
  border-radius: 18px;
  border: 2px solid transparent;
  overflow: hidden;
  background: var(--sand);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: border-color .2s ease, transform .2s ease;
}
.thumb:hover {
  transform: translateY(-2px);
  border-color: rgba(21, 101, 255, 0.24);
}
.thumb.active { border-color: var(--accent); }
.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.thumb svg { opacity: 0.15; }

.info-panel {
  padding: 24px;
}
.quick-specs {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 22px;
}
.quick-card {
  padding: 15px 16px;
  border-radius: 18px;
  background: var(--sand);
}
.quick-card span {
  display: block;
  margin-bottom: 5px;
  font-size: 11px;
  color: var(--stone-dark);
  text-transform: uppercase;
  letter-spacing: 0.8px;
}
.quick-card strong {
  display: block;
  font-size: 15px;
}
.info-section + .info-section {
  margin-top: 24px;
  padding-top: 24px;
  border-top: 1px solid rgba(115, 109, 98, 0.14);
}
.info-section h3 {
  font-family: 'Syne', sans-serif;
  font-size: 22px;
  letter-spacing: -0.8px;
  margin-bottom: 14px;
}
.description {
  font-size: 15px;
  line-height: 1.8;
  color: var(--stone-dark);
}
.features-list {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.feature-chip {
  padding: 8px 14px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 13px;
  font-weight: 500;
}
.action-card {
  margin-top: 26px;
  padding: 20px;
  border-radius: 22px;
  background: linear-gradient(135deg, #0d1117, #13213f 75%);
  color: white;
}
.action-card h4 {
  font-family: 'Syne', sans-serif;
  font-size: 24px;
  line-height: 1.05;
  letter-spacing: -0.9px;
  margin-bottom: 10px;
}
.action-card p {
  color: rgba(255,255,255,0.75);
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 18px;
}
.action-btns {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  padding: 20px;
  background: rgba(13, 17, 23, 0.56);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 220;
}
.modal-overlay.open { display: flex; }
.modal {
  width: min(100%, 520px);
  max-height: calc(100vh - 40px);
  overflow-y: auto;
  border-radius: 28px;
  background: #fff;
  box-shadow: var(--shadow);
  padding: 28px;
  position: relative;
}
.modal-title {
  font-family: 'Syne', sans-serif;
  font-size: 28px;
  line-height: 1.02;
  letter-spacing: -1px;
  margin-bottom: 8px;
}
.modal-subtitle {
  margin-bottom: 20px;
  font-size: 14px;
  color: var(--stone-dark);
}
.modal form {
  display: grid;
  gap: 14px;
}
.modal-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.modal input,
.modal select {
  width: 100%;
  padding: 14px 15px;
  border-radius: 16px;
  border: 1px solid rgba(115, 109, 98, 0.18);
  outline: none;
  transition: border-color .2s ease, box-shadow .2s ease;
}
.modal input:focus,
.modal select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(21, 101, 255, 0.08);
}
.modal-btn {
  padding: 15px 16px;
  border: none;
  border-radius: 16px;
  background: var(--accent);
  color: white;
  font-weight: 700;
  cursor: pointer;
}
.modal-btn:hover { background: var(--accent-dark); }
.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
  background: var(--sand);
  cursor: pointer;
  font-size: 20px;
}
.modal-success {
  text-align: center;
  padding: 18px 0;
}
.modal-success h3 {
  font-family: 'Syne', sans-serif;
  font-size: 28px;
  margin-bottom: 8px;
}
.modal-success p {
  color: var(--stone-dark);
  line-height: 1.7;
}
.modal-success .checkmark {
  width: 72px;
  height: 72px;
  margin: 0 auto 16px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(22, 124, 72, 0.12);
  color: var(--green);
  font-size: 32px;
  font-weight: 700;
}

.image-modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.92);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 260;
  padding: 20px;
}
.image-modal.open { display: flex; }
.image-modal img {
  max-width: 100%;
  max-height: 100%;
  border-radius: 20px;
}
.image-modal-close,
.image-modal-nav {
  position: absolute;
  border: none;
  border-radius: 50%;
  background: rgba(255,255,255,0.16);
  color: white;
  cursor: pointer;
}
.image-modal-close {
  top: 18px;
  right: 18px;
  width: 42px;
  height: 42px;
  font-size: 20px;
}
.image-modal-nav {
  top: 50%;
  transform: translateY(-50%);
  width: 48px;
  height: 48px;
  font-size: 26px;
}
.image-modal-prev { left: 18px; }
.image-modal-next { right: 18px; }

@media (max-width: 1080px) {
  .detail-grid {
    grid-template-columns: 1fr;
  }
  .gallery-panel {
    position: static;
  }
}

@media (max-width: 768px) {
  .container { width: min(calc(100% - 32px), 1180px); }
  .nav-shell {
    min-height: 68px;
    flex-wrap: wrap;
    padding: 10px 0;
  }
  .nav-actions {
    width: 100%;
    justify-content: space-between;
  }
  .page-shell { padding: 22px 0 52px; }
  .summary-banner,
  .gallery-panel,
  .info-panel {
    padding: 18px;
    border-radius: 24px;
  }
  .summary-top {
    flex-direction: column;
    align-items: flex-start;
  }
  .quick-specs,
  .action-btns,
  .modal-row {
    grid-template-columns: 1fr;
  }
  .thumb-row {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(110px, 1fr);
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .thumb-row::-webkit-scrollbar { display: none; }
  .main-img { height: 280px; }
  .modal-overlay {
    align-items: flex-end;
    padding: 0;
  }
  .modal {
    width: 100%;
    max-height: 88vh;
    border-radius: 28px 28px 0 0;
    padding: 22px;
  }
  .image-modal-nav {
    width: 42px;
    height: 42px;
    font-size: 22px;
  }
}

@media (max-width: 520px) {
  .container { width: min(calc(100% - 24px), 1180px); }
  .nav-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .pill-btn {
    width: 100%;
    justify-content: center;
    padding-inline: 12px;
  }
  .breadcrumb { font-size: 12px; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="container nav-shell">
    <a href="/" class="logo">Auto<span>Prime</span></a>
    <div class="nav-actions">
      <button class="pill-btn" type="button" onclick="history.back()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"></path></svg>
        Артқа
      </button>
      <button class="pill-btn primary" type="button" onclick="openTDModal()">Тест-драйв</button>
    </div>
  </div>
</header>

<main class="page-shell">
  <div class="container" id="page-content">
    <div class="loading-page">Автомобиль деректері жүктелуде...</div>
  </div>
</main>

<div class="modal-overlay" id="td-modal" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" type="button" onclick="document.getElementById('td-modal').classList.remove('open')">×</button>
    <div id="modal-body">
      <div class="modal-title">Тест-драйвқа жазылу</div>
      <div class="modal-subtitle" id="modal-car-name">Автомобиль таңдалды</div>
      <form onsubmit="submitTD(event)">
        <div class="modal-row">
          <input type="text" id="td-name" placeholder="Атыңыз *" required>
          <input type="tel" id="td-phone" placeholder="Телефон *" required>
        </div>
        <input type="email" id="td-email" placeholder="Email">
        <div class="modal-row">
          <input type="date" id="td-date" required>
          <input type="time" id="td-time" value="10:00" required>
        </div>
        <button type="submit" class="modal-btn">Өтінім жіберу</button>
      </form>
    </div>
  </div>
</div>

<div class="image-modal" id="image-modal" onclick="closeImageModal(event)">
  <button class="image-modal-close" id="image-modal-close" type="button">×</button>
  <button class="image-modal-nav image-modal-prev" type="button" onclick="prevImage(); event.stopPropagation();">‹</button>
  <button class="image-modal-nav image-modal-next" type="button" onclick="nextImage(); event.stopPropagation();">›</button>
  <img id="image-modal-img" src="" alt="Full photo">
</div>

<script>
const carId = window.location.pathname.split('/').pop();
let currentCar = null;
let modalImageIndex = 0;
let modalImageList = [];

async function loadCar() {
  try {
    const res = await fetch('/api/cars/' + carId);
    if (!res.ok) throw new Error('Not found');
    currentCar = await res.json();
    renderCarPage(currentCar);
  } catch (e) {
    document.getElementById('page-content').innerHTML = '<div class="loading-page">Автомобиль табылмады. <a href="/" style="color: var(--accent)">Каталогқа оралу</a></div>';
  }
}

function setActiveThumb(src) {
  document.querySelectorAll('.thumb').forEach((thumb) => {
    thumb.classList.toggle('active', thumb.dataset.src === src);
  });
}

function setMainImage(src) {
  const mainImg = document.querySelector('.main-img img');
  if (!mainImg) return;
  mainImg.src = src;
  mainImg.setAttribute('onclick', `openImageModal('${src}')`);
  modalImageIndex = modalImageList.indexOf(src);
  if (modalImageIndex === -1) modalImageIndex = 0;
  setActiveThumb(src);
}

function openImageModal(src) {
  const modal = document.getElementById('image-modal');
  const img = document.getElementById('image-modal-img');
  if (!modal || !img) return;
  modalImageIndex = modalImageList.indexOf(src);
  if (modalImageIndex === -1) modalImageIndex = 0;
  img.src = modalImageList[modalImageIndex] || src;
  modal.classList.add('open');
}

function prevImage() {
  if (!modalImageList.length) return;
  modalImageIndex = (modalImageIndex - 1 + modalImageList.length) % modalImageList.length;
  showModalImage(modalImageIndex);
}

function nextImage() {
  if (!modalImageList.length) return;
  modalImageIndex = (modalImageIndex + 1) % modalImageList.length;
  showModalImage(modalImageIndex);
}

function showModalImage(index) {
  const img = document.getElementById('image-modal-img');
  if (!img) return;
  img.src = modalImageList[index];
}

function closeImageModal(e) {
  if (e.target.id === 'image-modal' || e.target.id === 'image-modal-close') {
    document.getElementById('image-modal').classList.remove('open');
  }
}

document.addEventListener('keydown', (event) => {
  const modal = document.getElementById('image-modal');
  if (modal && modal.classList.contains('open')) {
    if (event.key === 'ArrowLeft') prevImage();
    if (event.key === 'ArrowRight') nextImage();
    if (event.key === 'Escape') modal.classList.remove('open');
  }

  const tdModal = document.getElementById('td-modal');
  if (event.key === 'Escape' && tdModal.classList.contains('open')) {
    tdModal.classList.remove('open');
  }
});

function renderCarPage(car) {
  document.title = `${car.brand} ${car.model} — AutoPrime`;
  modalImageList = car.images && car.images.length ? car.images : [];
  const primaryImage = modalImageList[0] || '';

  const html = `
    <div class="car-detail">
      <section class="summary-banner">
        <div class="breadcrumb">
          <a href="/">Каталог</a>
          <span>›</span>
          <span>${car.brand}</span>
          <span>›</span>
          <span>${car.brand} ${car.model}</span>
        </div>
        <div class="summary-top">
          <div>
            <div class="car-brand">${car.brand} • ${car.year}</div>
            <h1 class="car-fullname">${car.brand} ${car.model}</h1>
            <div class="car-price-big">${car.price.toLocaleString()} ₸</div>
          </div>
          <div>
            <span class="status-badge ${car.status === 'Жаңа' ? 'badge-new' : 'badge-used'}">${car.status}</span>
            <p class="summary-note">Несие мүмкіндігі бар, техникалық сипаттамалар толық көрсетілген, өтінім телефонда да, компьютерде де жылдам жіберіледі.</p>
          </div>
        </div>
      </section>

      <div class="detail-grid">
        <section class="panel gallery-panel">
          <div class="main-img">
            ${primaryImage ? `<img src="${primaryImage}" alt="${car.brand} ${car.model}" onclick="openImageModal('${primaryImage}')">` : `<svg width="200" height="100" viewBox="0 0 200 100" fill="none"><rect x="20" y="40" width="160" height="45" rx="12" fill="#0a0a0a"></rect><rect x="50" y="20" width="100" height="35" rx="8" fill="#0a0a0a"></rect><circle cx="55" cy="88" r="14" fill="#555"></circle><circle cx="145" cy="88" r="14" fill="#555"></circle><circle cx="55" cy="88" r="7" fill="#aaa"></circle><circle cx="145" cy="88" r="7" fill="#aaa"></circle></svg>`}
            <span class="status-badge main-badge ${car.status === 'Жаңа' ? 'badge-new' : 'badge-used'}">${car.status}</span>
          </div>
          <div class="thumb-row">
            ${modalImageList.length ? modalImageList.map((img, idx) => `
              <div class="thumb ${idx === 0 ? 'active' : ''}" data-src="${img}" onclick="setMainImage('${img}')">
                <img src="${img}" alt="thumb-${idx + 1}">
              </div>
            `).join('') : [1, 2, 3].map(() => `<div class="thumb"><svg width="70" height="40" viewBox="0 0 200 100" fill="none"><rect x="20" y="40" width="160" height="45" rx="12" fill="#0a0a0a"></rect><rect x="50" y="20" width="100" height="35" rx="8" fill="#0a0a0a"></rect><circle cx="55" cy="88" r="12" fill="#555"></circle><circle cx="145" cy="88" r="12" fill="#555"></circle></svg></div>`).join('')}
          </div>
        </section>

        <section class="panel info-panel">
          <div class="quick-specs">
            <div class="quick-card"><span>Двигатель</span><strong>${car.engine}</strong></div>
            <div class="quick-card"><span>Қуат</span><strong>${car.power}</strong></div>
            <div class="quick-card"><span>Қорап</span><strong>${car.transmission}</strong></div>
            <div class="quick-card"><span>Жетек</span><strong>${car.drive}</strong></div>
            <div class="quick-card"><span>Отын</span><strong>${car.fuel}</strong></div>
            <div class="quick-card"><span>Кузов</span><strong>${car.body}</strong></div>
            <div class="quick-card"><span>Түс</span><strong>${car.color}</strong></div>
            <div class="quick-card"><span>Жүгіру</span><strong>${car.mileage === 0 ? '0 км (жаңа)' : car.mileage.toLocaleString() + ' км'}</strong></div>
          </div>

          <div class="info-section">
            <h3>Сипаттама</h3>
            <p class="description">${car.description}</p>
          </div>

          ${car.features && car.features.length ? `
          <div class="info-section">
            <h3>Жабдықтау</h3>
            <div class="features-list">
              ${car.features.map((feature) => `<div class="feature-chip">${feature}</div>`).join('')}
            </div>
          </div>` : ''}

          <div class="action-card">
            <h4>Көлікті жақыннан көргіңіз келе ме?</h4>
            <p>Тест-драйвқа дәл қазір жазылыңыз немесе менеджерге бірден қоңырау шалыңыз.</p>
            <div class="action-btns">
              <button class="pill-btn primary" type="button" onclick="openTDModal()">Тест-драйвқа жазылу</button>
              <button class="pill-btn" type="button" onclick="window.location='tel:+77273000000'">Қоңырау шалу</button>
            </div>
          </div>
        </section>
      </div>
    </div>
  `;

  document.getElementById('page-content').innerHTML = html;
}

function openTDModal() {
  if (!currentCar) return;
  document.getElementById('modal-car-name').textContent = `${currentCar.brand} ${currentCar.model} (${currentCar.year})`;
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('td-date').min = today;
  document.getElementById('td-date').value = today;
  document.getElementById('td-modal').classList.add('open');
}

function closeModal(e) {
  if (e.target.id === 'td-modal') document.getElementById('td-modal').classList.remove('open');
}

async function submitTD(e) {
  e.preventDefault();
  const data = {
    name: document.getElementById('td-name').value,
    phone: document.getElementById('td-phone').value,
    email: document.getElementById('td-email').value,
    carId: currentCar.id,
    date: document.getElementById('td-date').value,
    time: document.getElementById('td-time').value
  };

  try {
    await fetch('/api/testdrives', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    document.getElementById('modal-body').innerHTML = `
      <div class="modal-success">
        <div class="checkmark">✓</div>
        <h3>Жазылдыңыз</h3>
        <p>${data.date} күні ${data.time} уақытында тест-драйвқа өтінім қабылданды. Жақын арада хабарласамыз.</p>
      </div>
    `;
  } catch (err) {
    alert('Қате шықты, қайтадан байқаңыз');
  }
}

loadCar();
</script>
</body>
</html>
